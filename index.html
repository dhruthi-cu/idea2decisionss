<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea2Decision | From idea to decision</title>
<meta name="description" content="Idea2Decision: turn an idea into a decision. Find ideas that can work where you live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F4;--surface:#FFFFFF;--surface2:#F5F8F9;--ink:#12232E;--muted:#576B78;--line:#D3DDE2;
  --accent:#0F7B7D;--accent-ink:#FFFFFF;--gold:#E0A100;--danger:#B3323F;--ok:#2E7D32;
  --c1:#0F8B8D;--c2:#E0A100;--c3:#5B5BD6;--c4:#D1495B;--c5:#5E9E3D;
  --shadow:0 1px 2px rgba(18,35,46,.06),0 8px 24px rgba(18,35,46,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0B171E;--surface:#12232C;--surface2:#183040;--ink:#E7EFF3;--muted:#92A8B4;--line:#26404F;
  --accent:#3CC3C5;--accent-ink:#06222A;--gold:#F0B92A;--danger:#FF7A86;--ok:#7BD17F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:.55rem .95rem;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{padding:.3rem .65rem;font-size:.88rem}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.9rem}
input,select,textarea{width:100%;margin-top:.3rem;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400}
textarea{min-height:84px;resize:vertical}
.err{color:var(--danger);min-height:1.3em;font-size:.9rem;margin-bottom:.5rem}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:1rem 0}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(160deg,#0B3B44,#0A1F2A);color:#E7EFF3;padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:1.5rem}
.hero h1{font-size:clamp(2.2rem,4.4vw,3.6rem);max-width:12ch}
.hero p{max-width:40ch;color:#B7CBD4}
.hero svg{width:min(320px,70%);height:auto}
.authwrap{display:flex;align-items:center;justify-content:center;padding:2rem}
.authcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.6rem;box-shadow:var(--shadow)}
.tabs{display:flex;gap:.4rem;background:var(--surface2);padding:.3rem;border-radius:12px;margin-bottom:1.2rem}
.tabs button{flex:1;border:0;background:transparent;padding:.55rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:.85rem;color:var(--muted);margin-top:1rem}
.authcard .btn.primary{width:100%}

/* setup */
.setup{max-width:720px;margin:0 auto;padding:2rem 1rem 4rem}
.setup .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.6rem;box-shadow:var(--shadow);margin-top:1.2rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.checks{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 1rem}
.checks label{display:flex;align-items:center;gap:.4rem;margin:0;border:1px solid var(--line);padding:.35rem .7rem;border-radius:99px;font-weight:500;cursor:pointer;background:var(--surface)}
.checks input{width:auto;margin:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.6rem 1rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:800;font-size:1.2rem;white-space:nowrap}
.brand svg{width:30px;height:30px}
.nav{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none}
.nav button{border:0;background:transparent;padding:.5rem .85rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav button:not(.on):hover{background:var(--surface2);color:var(--ink)}
.burger{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px}
main{max-width:1180px;margin:0 auto;padding:1.5rem 1rem 4rem}
.pagehead{margin-bottom:1.2rem;display:grid;gap:.4rem}
.pagehead p{color:var(--muted);max-width:62ch}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(5,15,20,.5);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--surface);z-index:41;transform:translateX(105%);transition:transform .25s;padding:1.2rem;overflow-y:auto;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1.1rem}
#drawer.open{transform:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;font-size:.92rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.seg{display:flex;gap:.4rem}
.seg button{flex:1}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sect{border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:.6rem}

/* ideas */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;align-items:center}
.toolbar input,.toolbar select{margin:0;width:auto;flex:1;min-width:150px}
.toolbar .grow{flex:2;min-width:220px}
.count{color:var(--muted);font-size:.9rem;margin:0 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:var(--shadow)}
.card p{font-size:.9rem;color:var(--muted)}
.tag{font-size:.78rem;font-weight:700;color:var(--accent);}
.votebar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.votebar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.88rem;color:var(--muted)}
.meta b{color:var(--ink)}
.verdict{font-size:.8rem;font-weight:700;display:inline-block;padding:.15rem .55rem;border-radius:99px;width:fit-content}
.v-go{background:rgba(46,125,50,.14);color:var(--ok)}
.v-mid{background:rgba(224,161,0,.18);color:#8A6500}
[data-theme="dark"] .v-mid{color:var(--gold)}
.v-low{background:var(--surface2);color:var(--muted)}
.acts{display:flex;gap:.5rem;margin-top:auto}
.acts .btn{flex:1}
.acts .voted{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.more{display:block;margin:1.4rem auto 0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.sheet{background:var(--surface);border-radius:18px;max-width:860px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheethead{display:flex;justify-content:space-between;gap:1rem;padding:1.2rem 1.4rem;border-bottom:1px solid var(--line)}
.sheetbody{padding:1.2rem 1.4rem 1.6rem}
.mtabs{display:flex;gap:.3rem;padding:.6rem 1.4rem 0;border-bottom:1px solid var(--line);overflow-x:auto}
.mtabs button{border:0;background:transparent;padding:.6rem .9rem;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.mtabs button.on{color:var(--ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin:1rem 0}
.stat{background:var(--surface2);border-radius:12px;padding:.7rem .9rem}
.stat b{display:block;font-family:var(--display);font-size:1.3rem}
.stat span{font-size:.82rem;color:var(--muted)}
.flow{overflow-x:auto;background:var(--surface2);border-radius:14px;padding:.8rem;margin:.8rem 0 1.4rem}
.flow svg{display:block;margin:0 auto;max-width:100%;height:auto}
.flow .nb{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.flow .ns{fill:var(--accent);stroke:var(--accent)}
.flow .nd{fill:var(--surface);stroke:var(--gold);stroke-width:1.8}
.flow .nf{fill:var(--surface);stroke:var(--danger);stroke-width:1.6}
.flow text{font-size:13px;fill:var(--ink);font-family:var(--body)}
.flow .ts{fill:var(--accent-ink);font-weight:700}
.flow .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.flow .lb{font-size:12px;fill:var(--muted);font-weight:700}
.phase{border-left:3px solid var(--accent);padding:.2rem 0 .2rem 1rem;margin-bottom:1rem}
.phase h3{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.phase h3 small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:.85rem}
.phase ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--muted)}
.fb{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.7rem}
.fb small{color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:.7rem}
.msgs{display:flex;flex-direction:column;gap:.6rem;max-height:340px;overflow-y:auto;padding:.3rem}
.bub{max-width:85%;padding:.6rem .85rem;border-radius:14px;white-space:pre-wrap;font-size:.95rem}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem .7rem;font-size:.84rem;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.chat form{display:flex;gap:.5rem}
.chat form input{margin:0}
.chatpage .msgs{max-height:52vh;min-height:240px}
.panel2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem;box-shadow:var(--shadow)}

/* rank */
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.9rem;color:var(--muted);margin-bottom:1rem;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.93rem}
th,td{text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-size:.85rem;color:var(--muted)}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface2)}
.tscroll{overflow-x:auto;margin-bottom:1.6rem}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem;cursor:pointer;border-top-width:4px}
.chartcard h3{font-size:.98rem;display:flex;gap:.5rem}
.chartcard small{color:var(--muted);display:block;margin-bottom:.3rem}
.chart{width:100%;height:auto;display:block}
.ct{font-size:10px;fill:var(--muted);font-family:var(--body)}
.cl{font-size:11px;fill:var(--ink);font-family:var(--body)}

/* fit */
.fitgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.2rem;align-items:start}
.ring{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.bar{margin:.5rem 0}
.bar div{display:flex;justify-content:space-between;font-size:.88rem}
.bar span.t{display:block;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:.2rem}
.bar span.t i{display:block;height:100%;background:var(--accent)}
.reasons{padding-left:1.1rem;color:var(--muted)}
.reasons li{margin-bottom:.3rem}

/* history */
.urlbar{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.35rem .4rem .35rem 1rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
.urlbar input{border:0;margin:0;background:transparent;padding:.4rem 0}
.urlbar input:focus{outline:none}
.urlbar:focus-within{outline:3px solid var(--gold)}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;display:flex;justify-content:space-between;gap:1rem;align-items:center}
.hist li[data-act]{cursor:pointer}
.hist li[data-act]:hover{border-color:var(--accent)}
.hist small{color:var(--muted);white-space:nowrap}
.kind{font-size:.75rem;font-weight:700;color:var(--accent);margin-right:.5rem}

#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:10px;z-index:80;font-weight:600;box-shadow:var(--shadow)}

@media(max-width:860px){
  .auth{grid-template-columns:1fr}
  .hero{padding:1.6rem}
  .hero svg{width:150px}
  .fitgrid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .brand span{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="auth" class="auth" hidden></div>
<div id="setup" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="20,6 25,20 20,34 15,20" fill="var(--accent)"/><polygon points="20,6 25,20 15,20" fill="var(--gold)"/></svg>
      <span>Idea2Decision</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-act="page" data-p="ideas">Ideas</button>
      <button data-act="page" data-p="rank">Rank</button>
      <button data-act="page" data-p="fit">Local fit</button>
      <button data-act="page" data-p="history">History</button>
      <button data-act="page" data-p="chat">Chat</button>
    </nav>
    <button class="burger" data-act="drawer" aria-label="Open menu"><span></span><span></span><span></span></button>
  </header>
  <main id="view"></main>
</div>

<div id="scrim" data-act="closedrawer" hidden></div>
<aside id="drawer" aria-label="Menu" aria-hidden="true"></aside>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const fmtN=n=>Number(n).toLocaleString('en-IN');
const fmtCost=n=>n>=100000?'₹'+(n/100000).toFixed(1).replace('.0','')+' L':'₹'+fmtN(n);
const short=v=>v>=1000?(v/1000).toFixed(1)+'k':String(Math.round(v));
const COLORS=['#0F8B8D','#E0A100','#5B5BD6','#D1495B','#5E9E3D'];
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}

/* ================= data: 10 domains x 20 ideas x 50 styles = 10,000 ideas ================= */
const MODS=['Smart','Village','Solar','Low-cost','Women-led','Mobile','Student','Urban','Organic','Digital','Community','Premium','Rural','Eco','Rapid','Night','Campus','Family','Senior','Budget','Hybrid','Local','Pocket','Zero-waste','Festival','Coastal','Hill','Metro','Weekend','Subscription','Franchise','Co-op','Tiny','Open-source','Voice-first','Offline','Seasonal','Pop-up','On-demand','Shared','Heritage','Youth','Wholesale','Home-based','AI-powered','Modular','Express','Neighbourhood','Cloud','Fair-price'];
const URBAN_MODS=['Urban','Metro','Campus','Cloud','Night','Digital','AI-powered','Premium','Pop-up','Express'];
const RURAL_MODS=['Village','Rural','Home-based','Offline','Co-op','Seasonal'];
const DOMAINS=[
 {id:'agri',name:'Agriculture',base:60000,aff:[40,75,95],kw:['agri','farm','crop'],
  pitch:'helps farmers cut losses and reach better prices.',first:'farmers in two nearby villages',
  lic:'Udyam registration, GST once sales cross the limit, and any local mandi or agriculture licence',kit:'tools, storage and transport from local suppliers',
  market:'Start with farmer groups, FPOs and WhatsApp groups of local growers. Demonstrate on one farm and let results spread.',
  nouns:['Seed Bank','Drip Kit','Soil Lab','Cold Chain Cart','Mandi Tracker','Compost Hub','Greenhouse','Crop Insurance Desk','Tractor Share','Mushroom Farm','Beekeeping Unit','Dairy Collective','Millet Mill','Fish Pond','Agri Drone Service','Seedling Nursery','Organic Store','Irrigation Planner','Farm Stay','Harvest Exchange']},
 {id:'edu',name:'Education',base:40000,aff:[80,75,60],kw:['educat','school','study','learn'],
  pitch:'gives students better learning and skills close to home.',first:'students and parents from nearby schools',
  lic:'Udyam registration, a shop or society registration, and a trade licence if you rent a hall',kit:'a rented room, laptops or tablets, books and a projector',
  market:'Offer a free demo class, partner with a school or college club, and ask parents to refer other parents.',
  nouns:['Study Circle','Coding Camp','Library Pod','Language Club','Skill Academy','Exam Coach','Maker Lab','Tutor Network','Scholarship Finder','Career Desk','Reading Van','Robotics Club','Teacher Toolkit','Quiz Arena','Digital Class','Science Bus','Homework Helpline','Mentor Match','Craft School','Notes Exchange']},
 {id:'health',name:'Health',base:90000,aff:[80,75,65],kw:['health','medic','doctor','fitness'],
  pitch:'brings simple, affordable care and prevention to more people.',first:'families and elders in your neighbourhood',
  lic:'Udyam registration, and the clinical or Ayush registration that applies to your service',kit:'screening devices, furniture, supplies and a small trained team',
  market:'Work with local doctors, RWAs, panchayat offices and ASHA workers. Free check-up days build trust quickly.',
  nouns:['Health Kiosk','Mobile Clinic','Yoga Studio','Diet Planner','Elder Care Desk','Blood Donor Network','Medicine Reminder','Therapy Circle','First Aid Academy','Tele-Doctor Booth','Fitness Trail','Dental Camp','Eye Check Van','Ayush Corner','Sleep Lab','Vaccination Tracker','Pharmacy Locker','Wellness Cafe','Nutrition Pantry','Ambulance Finder']},
 {id:'energy',name:'Clean Energy',base:150000,aff:[70,80,85],kw:['energy','solar','power','electric'],
  pitch:'cuts power bills and brings reliable clean energy.',first:'shops, homes and farms with high power bills',
  lic:'Udyam registration, DISCOM approval for grid-connected systems, and a trained installer',kit:'panels or equipment from certified suppliers and safety gear',
  market:'Show a clear payback calculation to shop owners and farmers. Use subsidy schemes as a selling point.',
  nouns:['Solar Rooftop','Biogas Unit','Wind Pump','Charging Point','Battery Swap Station','Energy Audit Desk','Solar Dryer','Micro Grid','Smart Meter Service','LED Exchange','Solar Streetlight','Pellet Plant','Hydro Mill','Cookstove Shop','Solar Pump','Power Bank Rental','Heat Recovery Unit','Energy Coop','Panel Cleaning Service','Green Hydrogen Lab']},
 {id:'food',name:'Food & Hospitality',base:120000,aff:[85,75,55],kw:['food','cook','restaurant','cafe'],
  pitch:'serves tasty, safe food people come back for.',first:'office workers, students and families nearby',
  lic:'FSSAI registration, Udyam registration, and a local trade or shop licence',kit:'kitchen equipment, packaging, a refrigerator and a reliable ingredient supplier',
  market:'Give samples, list on delivery apps, and use WhatsApp menus for repeat orders. Consistency matters more than variety.',
  nouns:['Cloud Kitchen','Tiffin Service','Millet Cafe','Street Food Cart','Bakery Lab','Juice Bar','Meal Subscription','Spice Studio','Snack Brand','Food Truck','Community Kitchen','Pickle Works','Tea Stall','Ice Cream Parlour','Regional Thali House','Catering Desk','Sweet Shop','Ready Mix Unit','Homestyle Dhaba','Leftover Rescue']},

function wrapT(t,n){const w=t.split(' '),L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()});if(c)L.push(c);return L}
function flowSVG(i){
  const d=DOM[i.dom];
  const steps=[['s',i.name],['b',`Validate: talk to 20 people from ${d.first}`],['b',`Paperwork: ${d.lic.split(',')[0]}`],['b',`Budget about ${fmtCost(i.cost)} and source ${d.kit}`],['b','Build a small pilot and run it for 4 weeks'],['d','Do users come back?'],['b','Launch to the wider area'],['b','Track sales and feedback, then grow']];
  const cx=150,bw=260,gap=28;let y=10;const P=[];
  steps.forEach(s=>{const lines=wrapT(s[1],29),h=s[0]==='d'?88:Math.max(40,18+lines.length*17);P.push({y,h,t:s[0],lines});y+=h+gap});
  const H=y-gap+12;let o=`<svg width="520" height="${H}" viewBox="0 0 520 ${H}" role="img" aria-label="Flow chart for ${esc(i.name)}"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  const txt=(p,x,cls)=>p.lines.map((l,k)=>`<text x="${x}" y="${p.y+p.h/2-(p.lines.length-1)*8.5+k*17+4.5}" text-anchor="middle" class="${cls||''}">${esc(l)}</text>`).join('');
  P.forEach((p,k)=>{

function findIdea(t){for(const i of IDEAS)if(t.includes(i.name.toLowerCase()))return i;return null}
function aiReply(q,idea){
  const t=q.toLowerCase();idea=idea||findIdea(t);
  const dm=DOMAINS.find(d=>d.kw.some(k=>t.includes(k)));
  if(/^(hi|hello|hey|namaste)\b/.test(t))return 'Hi! Ask me for ideas within a budget, the top ideas in a domain, or open an idea and ask about its cost, first steps, risks, customers or paperwork.';
  const b=t.match(/(?:₹|rs\.?|inr|budget|under|below|within|upto|up to)\s*([\d,.]+)\s*(k|lakh|lakhs|l|crore|cr)?/);
  if(b&&!/steps|start/.test(t.replace(b[0],''))||b&&/idea|suggest|recommend/.test(t)){
    let n=parseFloat(b[1].replace(/,/g,''));const u=b[2];if(u==='k')n*=1e3;else if(u&&/^(l|lakh|lakhs)$/.test(u))n*=1e5;else if(u&&/^(crore|cr)$/.test(u))n*=1e7;
    const l=IDEAS.filter(i=>i.cost<=n&&(!dm||i.dom===dm.id)).sort((a,b)=>b.votes-a.votes).slice(0,5);
    return l.length?`Top ideas you can start with ${fmtCost(n)}${dm?' in '+dm.name:''}:\n`+l.map(i=>`• ${i.name}: ${fmtN(i.votes)} votes, start ${fmtCost(i.cost)}`).join('\n')+'\nOpen the Ideas page and search a name to see its full plan.':`Nothing in ${dm?dm.name:'the list'} starts at ${fmtCost(n)}. Try a higher budget or another domain.`;
  }
  if(/top|best|popular|most voted|trending/.test(t)&&!idea){
    const l=IDEAS.filter(i=>!dm||i.dom===dm.id).sort((a,b)=>b.votes-a.votes).slice(0,5);
    return `Most voted${dm?' '+dm.name:''} ideas:\n`+l.map((i,k)=>`${k+1}. ${i.name}: ${fmtN(i.votes)} votes, rating ${i.rating}`).join('\n');
  }
  if(idea){
    const d=DOM[idea.dom],n=idea.noun.toLowerCase();
    if(/cost|invest|money|budget|fund|capital|price/.test(t))return `${idea.name} needs about ${fmtCost(idea.cost)} to start. Keep 20% aside for surprises. Most of it goes into: ${d.kit}.`;
    if(/step|start|how|begin|build|plan|implement/.test(t))return `First steps for ${idea.name}:\n1. Talk to 20 people from ${d.first}.\n2. Register: ${d.lic.split(',')[0]}.\n3. Source ${d.kit}.\n4. Run a 4 week pilot with 10 to 30 users.\n5. Fix problems, then launch.\nThe Implementation tab has the full flow chart.`;
    if(/risk|problem|challeng|fail|danger/.test(t))return `Main risks for ${idea.name}:\n• Too few repeat customers. Check this in the pilot.\n• Costs creeping above ${fmtCost(idea.cost)}.\n• Difficulty is ${idea.diff}/5, so plan for ${idea.diff>=4?'extra training and a backup partner':'steady but manageable work'}.\n• Paperwork delays. Start registration early.`;
    if(/customer|market|promot|sell|advertis|user|client/.test(t))return d.market;
    if(/licen|regist|legal|gst|permit|paper/.test(t))return `For ${idea.name}: ${d.lic}. Rules vary by state and town, so confirm with your local office or a CA before you start.`;
    if(/time|long|when|month|launch/.test(t))return `Expect about ${idea.months} months to a pilot and ${idea.months+2} months to a full launch for ${idea.name}.`;
    if(/profit|earn|revenue|income|money make|return/.test(t)){const m=Math.round(idea.cost*0.12*(0.6+idea.rating/5)/1000)*1000;return `A rough planning figure for ${idea.name} is ₹${fmtN(m)} a month in sales once it is running well. This is only an estimate from the idea's cost and rating, not a promise. Build your own numbers during the pilot.`}
    if(/team|staff|hire|people|partner/.test(t))return `${idea.name} can start with you plus 1 or 2 helpers. Add people only after the pilot shows repeat customers.`;
    if(/where|location|place|area|fit/.test(t))return `Use the Local fit page to check ${idea.name} for your landmark, area, district, state and country.`;
    return `${idea.name}: ${fmtN(idea.votes)} votes, rating ${idea.rating}, start ${fmtCost(idea.cost)}, about ${idea.months} months to launch. Ask about cost, steps, risks, customers, paperwork or time.`;
  }
  return 'I can help with: ideas within a budget (try "ideas under ₹50,000"), the top ideas in a domain, or questions about a specific idea such as its cost, first steps, risks, customers or paperwork. Type an idea name to talk about it.';
}

function monthLabels(){const o=[],n=new Date();for(let k=5;k>=0;k--){const d=new Date(n.getFullYear(),n.getMonth()-k,1);o.push(d.toLocaleString('en',{month:'short'}))}return o}
function monthly(i){const r=rng(i.id*31),w=[0,1,2,3,4,5].map(k=>(1+k*.5)*(.8+r()*.4)),s=w.reduce((a,b)=>a+b,0);return w.map(x=>i.votes*x/s)}
function barSVG(vals,labels,col){
  const w=300,h=160,m={l:8,r:8,t:20,b:22},iw=w-m.l-m.r,ih=h-m.t-m.b,max=Math.max(...vals)*1.1||1,sl=iw/vals.length,bw=sl*.62;

  vals.forEach((v,k)=>{const x=m.l+sl*k+(sl-bw)/2,bh=v/max*ih,y=h-m.b-bh;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${col}"/><text class="ct" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${short(v)}</text><text class="ct" x="${x+bw/2}" y="${h-7}" text-anchor="middle">${labels[k]}</text>`});
  return s+'</svg>';

function lineSVG(vals,labels,col){

function donutSVG(parts,col){

const METROS=['bengaluru','bangalore','mumbai','delhi','chennai','hyderabad','kolkata','pune','ahmedabad','kochi','jaipur','lucknow','surat','gurugram','noida','chandigarh','indore','coimbatore','thiruvananthapuram','visakhapatnam'];
const COASTAL=['kerala','goa','tamil nadu','maharashtra','gujarat','odisha','west bengal','andhra pradesh','karnataka','puducherry'];
const HILLY=['himachal pradesh','uttarakhand','sikkim','jammu and kashmir','arunachal pradesh','meghalaya','nagaland','mizoram','manipur','ladakh','darjeeling'];
function placeType(l){
  const t=(l.landmark+' '+l.area+' '+l.district).toLowerCase();
  if(/village|gram|taluk|tehsil|mandal|panchayat|rural/.test(t))return 2;
  if(METROS.some(m=>t.includes(m)))return 0;
  if(/nagar|layout|colony|sector|mall|station|junction|airport|main road|city|market|college|campus/.test(t))return 0;
  return 1;
}
function fitScore(domId,idea,l){
  const d=DOM[domId],pt=placeType(l),st=l.state.toLowerCase(),coastal=COASTAL.includes(st),hilly=HILLY.includes(st)||/hill|ghat|himalay/.test((l.area+l.district).toLowerCase());
  let place=d.aff[pt],bonus=0;
  if(idea){const m=idea.mod;
    if(URBAN_MODS.includes(m))bonus=[12,2,-10][pt];else if(RURAL_MODS.includes(m))bonus=[-8,5,12][pt];
    else if(m==='Coastal')bonus=coastal?14:-12;else if(m==='Hill')bonus=hilly?14:-12;}
  const demand=idea?Math.min(100,30+idea.votes/50*.7):65;
  const region=domId==='community'?(coastal||hilly?92:62):domId==='energy'?(coastal?85:hilly?78:72):domId==='agri'?(coastal?78:hilly?66:80):70;
  const india=/india|bharat/i.test(l.country)?100:55;
  const total=Math.max(5,Math.min(98,Math.round(place*.45+demand*.25+region*.15+india*.15+bonus)));
  return {total,place,demand:Math.round(demand),region,india,bonus,pt,coastal,hilly};
}

  const alts=IDEAS.filter(i=>i.dom===dom&&(!idea||i.id!==idea.id)).map(i=>({i,s:fitScore(dom,i,l).total})).sort((a,b)=>b.s-a.s||b.i.votes-a.i.votes).slice(0,3);
  const C=2*Math.PI*44,bar=(n,v)=>`<div class="bar"><div><span>${n}</span><b>${Math.round(v)}</b></div><span class="t"><i style="width:${Math.max(3,Math.min(100,v))}%"></i></span></div>`;
  $('#fitout').innerHTML=`<div class="ring"><svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="Score ${r.total} out of 100"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="55" cy="55" r="44" fill="none" stroke="${vd[1]}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${r.total/100*C} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:26px;fill:var(--ink)">${r.total}</text></svg>
   <div><h2 style="color:${vd[1]}">${vd[0]}</h2><p class="muted">${esc(target)} at ${esc(l.area)}, ${esc(l.district)}, ${esc(l.state)}, ${esc(l.country)}</p></div></div>
   ${bar('Place type match',r.place)}${bar('Demand',r.demand)}${bar('Region',r.region)}${bar('Country fit',r.india)}
   <h3 style="margin:1rem 0 .4rem">Why</h3><ul class="reasons">${reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <h3 style="margin:1rem 0 .4rem">Best fits in ${esc(d.name)} for this place</h3><div class="chips">${alts.map(a=>`<button type="button" data-act="open" data-id="${a.i.id}">${esc(a.i.name)} (${a.s})</button>`).join('')}</div>
   <p class="hint">This is an estimate from rules built into the app (place type, region, votes and country). It does not use live local data, so confirm with 20 local people before investing.</p>`;
  logH('fit',`Local fit: ${target} at ${l.area}, ${l.district}, ${l.state} → ${r.total}/100`,idea?idea.id:null);
}

/* ================= history ================= */
const KIND={search:'Search',view:'Viewed',fit:'Local fit',chat:'Chat',vote:'Vote'};
function viewHistory(){
  view().innerHTML=`<div class="pagehead"><h1>History</h1><p>Search all ideas from the bar below, then see everything you did before.</p></div>
  <form class="urlbar" data-form="hsearch" role="search"><span aria-hidden="true">🔎</span><input name="q" placeholder="Search ideas, for example solar, tiffin or homestay" aria-label="Search ideas" autocomplete="off"><button class="btn primary">Search</button></form>
  <div id="hres"></div>
  <div class="toolbar" style="margin-top:1.4rem"><h2 style="flex:2">Your history</h2><input id="hfilter" type="search" placeholder="Filter history" aria-label="Filter history"><button class="btn" data-act="clearhist">Clear history</button></div>
  <ul class="hist" id="hlist"></ul>`;
  drawHist();
}
function drawHist(){
  const f=($('#hfilter')?.value||'').toLowerCase(),l=UD.history.filter(h=>!f||h.text.toLowerCase().includes(f));
  $('#hlist').innerHTML=l.map(h=>`<li ${h.id?`data-act="open" data-id="${h.id}" tabindex="0"`:''}><span><span class="kind">${KIND[h.type]||h.type}</span>${esc(h.text)}</span><small>${new Date(h.t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</small></li>`).join('')||'<li><span class="muted">Nothing here yet. Search, open ideas or run a local fit check and it will show up.</span></li>';
}
function histSearch(f){
  const q=f.elements.q.value.trim();if(!q)return;const ql=q.toLowerCase();
  const r=IDEAS.filter(i=>i.name.toLowerCase().includes(ql)||DOM[i.dom].name.toLowerCase().includes(ql)).sort((a,b)=>b.votes-a.votes);
  logH('search','Searched "'+q+'"');
  $('#hres').innerHTML=`<p class="count">${fmtN(r.length)} ideas for "${esc(q)}". Showing the top ${Math.min(12,r.length)}.</p><div class="grid">${r.slice(0,12).map(cardHTML).join('')}</div>`;drawHist();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return}
  const a=el.dataset.act,id=+el.dataset.id;
  switch(a){
    case 'authtab':showAuth(el.dataset.m);break;
    case 'page':setPage(el.dataset.p);break;
    case 'drawer':openDrawer();break;
    case 'closedrawer':closeDrawer();break;
    case 'theme':setTheme(el.dataset.t);openDrawer();break;
    case 'logout':logout();break;
    case 'delete':deleteAccount();break;
    case 'editprofile':closeDrawer();showSetup(true);break;
    case 'cancelsetup':$('#setup').hidden=true;$('#setup').style.cssText='';break;
    case 'more':S.limit+=24;updateGrid();break;
    case 'morerank':S.rankCount=Math.min(30,S.rankCount+6);viewRank();break;
    case 'vote':vote(id);break;
    case 'open':openIdea(id);break;
    case 'closemodal':closeModal();break;
    case 'tab':S.tab=el.dataset.t;renderSheet(S.openId);break;
    case 'gofit':S.fitIdea=id;closeModal();setPage('fit');break;
    case 'chip':{const f=el.closest('.chat').querySelector('form');sendChat(f,el.dataset.q);break}
    case 'clearhist':if(confirm('Clear all history?')){UD.history=[];saveUD();drawHist()}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else closeDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chartcard,.hist li[data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  switch(f.dataset.form){
    case 'login':doLogin(f);break;
    case 'signup':doSignup(f);break;
    case 'profile':saveProfile(f);break;
    case 'chat':sendChat(f);break;
    case 'fit':runFit(f);break;
    case 'hsearch':histSearch(f);break;
    case 'feedback':{
      const i=IDEAS[f.dataset.id-1],g=n=>f.elements[n].value.trim();
      if(!g('worked')&&!g('change'))return $('#ferr').textContent='Write what worked or what should change.';
      const fb=LS.get('ic_feedback',{});(fb[i.id]=fb[i.id]||[]).unshift({by:me.email,name:me.profile.name,did:g('did'),rating:+g('rating'),spent:g('spent'),worked:g('worked'),change:g('change'),t:Date.now()});
      LS.set('ic_feedback',fb);logH('view','Gave feedback on '+i.name,i.id);toast('Thanks for your feedback');renderSheet(i.id);break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.limit=24;updateGrid()}
  if(e.target.id==='hfilter')drawHist();
});
document.addEventListener('change',e=>{
  if(e.target.id==='dom'){S.dom=e.target.value;S.limit=24;updateGrid()}
  if(e.target.id==='sort'){S.sort=e.target.value;S.limit=24;updateGrid()}
  if(e.target.id==='q'&&e.target.value.trim())logH('search','Searched "'+e.target.value.trim()+'"');
});

/* ================= boot ================= */
(function boot(){
  setTheme(LS.get('ic_theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  const email=LS.get('ic_session',null);
  if(email&&users()[email]){loadUser(email);profileDone()?enterApp():showSetup(false)}else showAuth('login');
})();
</script>
</body>
</html>
